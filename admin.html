<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ship Happens — Admin</title>
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="passwordGate">
  <div class="gate-card">
    <h1>Ship Happens — Admin</h1>
    <input id="passwordInput" type="password" placeholder="Admin password" autocomplete="off" />
    <button id="passwordSubmit">Enter</button>
    <p id="passwordError" class="error hidden"></p>
  </div>
</div>

<div id="adminPanel" class="hidden">
  <header>
    <h1>Ship Happens — Admin</h1>
    <button id="refreshBtn">Refresh</button>
  </header>

  <section id="statsSection">
    <h2>Stats</h2>
    <div id="statsGrid" class="stats-grid"></div>
  </section>

  <section id="runsSection">
    <h2>Runs</h2>
    <div class="filters">
      <label><input id="filterSuspicious" type="checkbox" /> Suspicious only</label>
      <label><input id="filterApproved" type="checkbox" /> Approved only</label>
    </div>
    <table id="runsTable">
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Ending</th><th>Sprint</th><th>Budget</th><th>Duration</th>
          <th>Checkpoints</th><th>Suspicious</th><th>Approved</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="runsBody"></tbody>
    </table>
    <div class="pager">
      <button id="prevPageBtn">&larr; Prev</button>
      <span id="pageLabel">1</span>
      <button id="nextPageBtn">Next &rarr;</button>
    </div>
  </section>

  <section id="feedbackSection">
    <h2>Feedback</h2>
    <table id="feedbackTable">
      <thead>
        <tr>
          <th>ID</th><th>Received</th><th>Message</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="feedbackBody"></tbody>
    </table>
    <div class="pager">
      <button id="feedbackPrevPageBtn">&larr; Prev</button>
      <span id="feedbackPageLabel">1</span>
      <button id="feedbackNextPageBtn">Next &rarr;</button>
    </div>
  </section>
</div>

<script src="admin.js"></script>
</body>
</html>
